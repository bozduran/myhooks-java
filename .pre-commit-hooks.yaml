- id: myhooks
  name: jrxml clear + format + sort + textcheck + validate + report
  description: >-
    Runs the clear step (unused declarations + jsonql), the format step
    (attributes + expression + report name), the sort step (geometry order), the
    textcheck step (rendered-text rules), the validate step (XSD + compile gate),
    the lint step (static-analysis warnings) and the report step (include-chain)
    on staged .jrxml files. Applied changes are left unstaged and the hook stops
    the commit for review.
  entry: bin/myhooks
  language: script
  files: \.jrxml$
  pass_filenames: true
  require_serial: true
